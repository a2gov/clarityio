[project]
name = "clarityio"
version = "1.1.0"
description = "Retrieve air quality data from the Clarity.io API"
authors = [
  { name="Sam Firke", email="samuel.firke@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.0.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=6.0.0", "twine>=5.0.0", "build>=1.0.0"]

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]

[project.urls]
Homepage = "https://github.com/a2gov/clarityio"
Issues = "https://github.com/a2gov/clarityio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
